name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: plnt runtime (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  booking:
    name: examples/booking (pytest, Temporal in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . -e "examples/booking[dev]"
      - run: pytest -q
        working-directory: examples/booking

  booking-web:
    name: examples/booking/web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/booking/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/booking/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  site:
    name: site (astro build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:app
