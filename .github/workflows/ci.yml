name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: plnt runtime (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Lint is enforced on modules rewritten for the platform; older modules
      # are brought under it as they are touched.
      - run: ruff check plnt/models plnt/agent plnt/compute plnt/bundles plnt/tenancy plnt/executors plnt/server plnt/cli_platform.py registry/bundles setup.py
      - run: python scripts/smoke_platform.py
      - run: pytest -q

  booking:
    name: examples/booking (pytest, Temporal in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . -e "examples/booking[dev]"
      - run: pytest -q
        working-directory: examples/booking

  booking-web:
    name: examples/booking/web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/booking/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/booking/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  site:
    name: site (build, playground browser e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: bash site/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: site/e2e-shots

  console:
    name: console (lint, build, browser e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci
        working-directory: console
      - run: npm run lint
        working-directory: console
      - run: npm run build
        working-directory: console
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: bash console/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-screenshots
          path: console/e2e-shots

  package:
    name: package (wheel + sdist, installed and run outside the checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci && npm run build
        working-directory: console
      - run: pip install build && python -m build
      - run: bash scripts/check_dist.sh dist/*.whl
      # the sdist must build a complete wheel on its own
      - run: |
          mkdir sd && tar xzf dist/*.tar.gz -C sd --strip-components=1
          cd sd && python -m build --wheel --outdir ../sdist-wheel
          bash ../scripts/check_dist.sh ../sdist-wheel/*.whl

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t plnt:ci .
      - run: |
          docker run -d --name plnt -p 8787:8787 -e PLNT_ADMIN_TOKEN=ci plnt:ci
          for i in $(seq 30); do curl -sf localhost:8787/v1/health && break; sleep 1; done
          curl -sf localhost:8787/v1/health | grep '"version"'
          curl -sf localhost:8787/console | grep -qi '<div id="root">'
          curl -sf localhost:8787/v1/bundles | grep -q support-desk
          curl -sf -X POST localhost:8787/v1/tenants -H 'Authorization: Bearer ci' \
            -H 'content-type: application/json' -d '{"id":"acme"}' | grep -q pk_
          docker exec plnt ls /data/tenants/acme
      # The way render.yaml runs it: platform-assigned PORT, playground on by env.
      - run: |
          docker run -d --name pg -p 9000:9000 -e PORT=9000 -e PLNT_PLAYGROUND=1 plnt:ci
          for i in $(seq 30); do curl -sf localhost:9000/v1/playground && break; sleep 1; done
          curl -sf localhost:9000/v1/playground | grep -q bright-smile-dental
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9000/v1/tenants)" = 503
      - if: failure()
        run: docker logs plnt; docker logs pg || true
