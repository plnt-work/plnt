name: local-models

# Runs the agent loop against a real Ollama model. Slower than `ci` (pulls a
# ~1 GB model), so it runs when the model layer changes, nightly, and on demand.
on:
  push:
    paths:
      - "plnt/models/**"
      - "plnt/agent/**"
      - "plnt/execution/runner.py"
      - ".github/workflows/local-models.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to test
        default: qwen2.5:1.5b

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL: ${{ github.event.inputs.model || 'qwen2.5:1.5b' }}
      PLNT_LOCAL_URL: http://127.0.0.1:11434
      PLNT_NUM_CTX: "8192"
      PLNT_MODEL_TIMEOUT: "300"
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pull model
        run: |
          curl -sf http://127.0.0.1:11434/api/pull -d "{\"model\": \"$MODEL\", \"stream\": false}"
      - name: plnt models doctor
        run: PLNT_PLANNER_MODEL="$MODEL" PLNT_DEEP_MODEL="$MODEL" plnt models doctor
      - name: Real tool-calling agent run
        run: PLNT_TEST_OLLAMA_MODEL="$MODEL" pytest -q tests/test_local_model_e2e.py -k real_ollama
