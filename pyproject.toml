[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plnt"
version = "0.1.0"
description = "Open-source runtime for shipping one agent to many isolated tenants — per-tenant sandbox, budgets, memory, secrets and audit, on any model, local or cloud."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Plnt" }]
keywords = ["agents", "multi-tenant", "sandbox", "ollama", "local-llm", "tool-calling", "agent-runtime"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
    "structlog>=24.0",
    "sse-starlette>=2.0",
    "anyio>=4.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.9",
]
docker = [
    "docker>=7.0",
]
temporal = [
    "temporalio>=1.7",
]
semantic = [
    "fastembed>=0.3",
    "faiss-cpu>=1.7",
    "numpy>=1.26",
]

[project.scripts]
plnt = "plnt.cli:main"
plnt-agent-runner = "plnt.execution.runner:main"

[project.urls]
Homepage = "https://plnt.work"
Documentation = "https://plnt.work/docs/"
Source = "https://github.com/plnt-work/plnt"
Changelog = "https://github.com/plnt-work/plnt/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["plnt*"]

# The built console (console/ -> plnt/server/console, when built) ships in the
# wheel. registry/bundles is copied to plnt/_bundles by setup.py.
[tool.setuptools.package-data]
plnt = ["server/console/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
