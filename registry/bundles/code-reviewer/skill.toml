[meta]
name = "code-reviewer"
version = "0.1.0"
description = "Reviews the code in a workspace for bugs, security issues or style, and reports findings with path:line citations."
tags = ["code", "review", "developer"]

[runtime]
model_hint = "small"
tools = ["list_files", "read_file", "search"]
require_tool = "read_file"
max_steps = 10

[budget]
tokens = 30000
wall_seconds = 180
