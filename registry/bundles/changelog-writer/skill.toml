[meta]
name = "changelog-writer"
version = "0.1.0"
description = "Writes release notes or a changelog entry from a workspace's git history and diffs."
tags = ["code", "release", "developer"]

[runtime]
model_hint = "small"
tools = ["list_files", "read_file", "search", "execute"]
# no required tool
max_steps = 10

[budget]
tokens = 30000
wall_seconds = 180
